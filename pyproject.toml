[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exactref"
version = "0.1.0"
description = "Exact reference answers, with proven error bounds, for testing numerical code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

# Wheels for the platforms PyTorch publishes wheels for. Each is one abi3 wheel, built for
# CPython 3.10's limited API (setup.py), so it serves CPython 3.10 and newer; free-threaded builds cannot load abi3
# wheels and are not supported.
[tool.cibuildwheel]
build = "cp310-*"
skip = "*-musllinux_*"
test-command = "python -c \"import math, random, exactref as er; from fractions import Fraction as F; r = random.Random(1); a = [r.uniform(-1, 1) for _ in range(4096)]; b = [r.uniform(-1, 1) for _ in range(4096)]; m = er.matmul(er.asarray([a], 'float64'), er.asarray([[x] for x in b], 'float64')); assert m.rounded.tolist() == [[float(sum(F(x) * F(y) for x, y in zip(a, b)))]]; assert er.matrix_exp(er.asarray([[1.0]], 'float64')).rounded.tolist() == [[math.e]]; assert er.float32.encode(F(1, 3)) == 0x3EAAAAAB\""

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
